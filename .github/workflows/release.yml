name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the checked distributions to PyPI
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: require public main and successful quality checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test ! -e release/public.toml
          test -f .mirror-source
          test "$(gh run list --workflow quality.yml --branch main --commit "$GITHUB_SHA" --status success --json databaseId --jq length)" -gt 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: build the source archive and rebuild its wheel
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir dist
          python scripts/checks/distribution/wheel_contents.py dist/*.whl
          python -m twine check --strict dist/*
          sha256sum dist/* >> "$GITHUB_STEP_SUMMARY"
      - name: exercise the built wheel with base dependencies
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH -u PSYCHO_DATA_DIR -u PSYCHO_COMPUTE_DIR -u PSYCHO_REPL_DATA -u REPLICA_CHECKOUT \
            XDG_DATA_HOME="$RUNNER_TEMP/smoke-data" XDG_CACHE_HOME="$RUNNER_TEMP/smoke-cache" \
            "$RUNNER_TEMP/wheel-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/checks/distribution/installed_wheel.py"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/replicaverse/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: publish with the configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
