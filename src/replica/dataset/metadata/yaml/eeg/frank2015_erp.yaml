description: >-
  ERP amplitudes from 24 participants reading the 205 sentences of the UCL
  eye-tracking corpus (Frank et al., 2013) one word at a time (Frank et al.,
  2015). The release file stimuli_erp.mat holds, for every word and
  participant, the mean amplitude of six components (ELAN 125 to 175 ms, LAN
  300 to 400 ms, N400 300 to 500 ms, EPNP 400 to 600 ms, P600 500 to 700 ms,
  PNP 600 to 700 ms) over the component's electrode sites, after a 0.50 Hz
  high-pass filter and the modulus transformation, the mean potential over
  the 100 ms before word onset, an artefact flag, and a flag for every trial
  the authors removed from their analysis. The package also carries the
  participants' continuous EEG (EEG01.mat to EEG24.mat, EEGLAB format,
  250 Hz, 0.05 to 25 Hz band-pass, mastoid reference) with word-onset
  events; the loader reads only the release file. The release numbers no
  sentence, so the loader reads the UCL release's stimuli.txt (ucl_et) and
  gives every sentence the UCL sentence number shared with ucl_et and ucl_spr.
