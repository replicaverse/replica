description: >-
  Critical-word N400 amplitudes from Hubbard et al. (2019), one of the five
  source studies pooled in the Szewczyk & Federmeier (2022) mega-N400 dataset
  and packaged for Kuribayashi et al. (2025). One N400 per subject per item by
  default, placed on the target word of the full sentence. The classical N400
  predictors are exposed as covariates: cloze probability, the ERP baseline
  (``bline``), log frequency, concreteness and orthographic neighborhood.

