description: >-
  Critical-word N400 amplitudes from Michaelov et al. (2024), as prepared for
  Kuribayashi et al. (2025). One N400 per subject per item by default (the
  centroparietal cluster mean over electrodes C3, C4, CP3, CP4, CPz, Cz, P3, P4,
  Pz), placed on the target word of the full sentence. The experimental condition
  (BC / Rel / Unrel / Implaus) rides on the stimulus; cloze, plausibility,
  frequency and orthographic neighborhood are exposed as covariates.

