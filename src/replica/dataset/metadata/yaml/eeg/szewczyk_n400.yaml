description: >-
  Critical-word N400 amplitudes from the five-study mega-N400 dataset assembled
  by Szewczyk & Federmeier (2022), loaded together as Kuribayashi et al. (2025)
  packaged it. Pools 138 subjects across five source studies (each also
  registered on its own via the release ``dataset`` column); shared items are the
  same sentence and critical word. One N400 per subject per item by default,
  placed on the target word of the full sentence. The classical N400 predictors
  are exposed as covariates: cloze probability, the ERP baseline (``bline``), log
  frequency, concreteness and orthographic neighborhood.

