description: >-
  EEG frequency-band power from ZuCo 1.0 (Hollenstein et al., 2018).
  Per-word mean power across 105 electrodes in 8 frequency bands
  (theta_1, theta_2, alpha_1, alpha_2, beta_1, beta_2, gamma_1, gamma_2)
  from 12 participants reading English sentences in three tasks: Normal
  Reading (NR, 300 sentences), Sentiment Reading (SR, 400 sentences) and
  Task-Specific Reading (TSR, 407 sentences). Full electrode-level data
  (105-dim per word) available as annotation layers, and on request the
  sentence EEG and gaze with fixation-locked word onsets as recordings.
  Data stored as MATLAB v5 (.mat) files shared with the eye-tracking view
  (datasets/eye-tracking/original/zuco1).
