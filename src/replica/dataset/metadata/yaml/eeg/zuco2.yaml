description: >-
  EEG frequency-band power from ZuCo 2.0 (Hollenstein et al., 2020).
  Per-word mean power across 105 electrodes in 8 frequency bands
  (theta_1, theta_2, alpha_1, alpha_2, beta_1, beta_2, gamma_1, gamma_2)
  from 18 participants reading 739 English sentences in two tasks:
  Normal Reading (NR, 349 sentences) and Task-Specific Reading (TSR,
  390 sentences). Full electrode-level data (105-dim per word) available
  as annotation layers. Data stored as MATLAB v7.3 (.mat) files shared
  with the eye-tracking view (datasets/eye-tracking/original/zuco2).
