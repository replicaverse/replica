description: 'CELER: eye-tracking from 365 participants (69 L1 English, 296 L2)
  reading WSJ newswire sentences. Each participant reads 156 sentences (78 shared
  + 78 individual); ≈28k unique sentences (≈321k word tokens of text), yielding
  ≈649k per-participant word observations.
  Requires LDC access to PTB-WSJ (LDC95T7) and BLLIP (LDC2000T43) before the
  eye-tracking archive can be downloaded.'
