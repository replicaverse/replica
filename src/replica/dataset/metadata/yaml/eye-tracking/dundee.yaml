description: >-
  The Dundee Corpus V.1 (February 2004), as distributed by its author: 10
  English participants each reading 20 newspaper editorials from The
  Independent. The release ships raw event records (one file per participant
  and text, in event order) and one word-object file per text; it provides no
  derived reading measures, stating that several definitions exist, so
  first-fixation, gaze, go-past and total-time measures are computed from the
  event stream. Copyright Alan Kennedy, 2003, 2004; use is permitted provided
  it is acknowledged.

