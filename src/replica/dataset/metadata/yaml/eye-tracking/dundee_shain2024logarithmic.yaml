processing: >-
  Shain et al. (2024) OSF release (project 6wvqe), which redistributes the
  corpus in CDR format: a fixation-event predictor table plus
  train/dev/test splits. The original release is available by author
  permission and is registered separately as `dundee_official`.
  Complete stimulus text comes from the author's english/items/textNN.itm
  display files, checked against txNNwrdp.dat word objects. The original MA1
  event files are required to verify every released event's timing and word
  position. The merged quotation region in article 18 retains both original
  word objects in one measured span. Events whose recorded screen/line
  disagrees with their word object have no word assignment; affected released
  aggregates are unavailable, with their original values retained in datum
  metadata. Other released measurements retain their source definitions.
distribution: third-party
distributed_by: Shain et al. (2024), OSF project 6wvqe
description: 'The Dundee Corpus: eye-movement data from 10 participants reading newspaper
