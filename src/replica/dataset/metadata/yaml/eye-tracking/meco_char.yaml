description: |-
  Per-fixation character-level eye-tracking data for 13 MECO L1 wave 1 languages
  (du, ee, en, fi, ge, gr, he, it, ko, no, ru, sp, tr). Per-language artefacts:
    (1) {lang}.csv: one row per fixation across all readers/trials. Columns:
        lang, reader, trial_id, fixid, letternum (0-based char index in the
        trial passage), letter, dur (ms), start, stop, right_bounded_time, x, y.
        English coordinates are in cm (x100 to recover OCR pixel space); other
        languages use OCR pixel coords directly.
    (2) stimulus_{lang}.csv: full per-character stimulus table aligned with
        fixation letternum. Columns: lang, trial_id, letternum, character.
original: false
derived_from: MECO
processing: |-
  Character-level preprocessing of MECO L1 wave-1:
  1. Per-(lang, reader, trial_id) trial-to-item mapping, and canonical
     per-(lang, item_id) passages reconstructed from the source .rda in
     (sentnum, wordnum) order.
  2. Per-language image-to-item mapping via OCR prefix-matching of the rendered
     item images against the reconstructed passages.
  3. OCR of each item image with Tesseract (--psm 6) for per-glyph bounding boxes.
  4. Passage-as-truth letter assignment: the passage supplies character identity;
     OCR supplies only spatial position (read RTL within-line for Hebrew).
  5. Line clustering by binning on center_y, padded inter-line boundaries, and
     word boxes from whitespace splitting.
  6. Each fixation matched to its character by selecting the line whose vertical
     band contains y, then the character whose horizontal extent contains x
     (nearest-center fallback within the line). Off-text fixations are dropped.
  English alignment uses a curated per-character sentence table; the other 12
  languages go through the steps above.
