description: MECO L1 wave-1 reading times pre-processed by Wilcox et al. (2023) for
  their TACL paper "Testing the Predictions of Surprisal Theory in 11 Languages".
  One CSV per language (one row per word and language model), merged with
  surprisal/entropy from four language models (mgpt_lc, mgpt_sc, monot_30m,
  monot_all). Ships 23 columns with four language models per word.
