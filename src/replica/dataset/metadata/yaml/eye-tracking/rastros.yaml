version: Eye-tracking 2022-02-12 and predictability norms 2022-03-12, OSF file version 1 each
release_date: '2022-03-12'
description: >-
  Brazilian Portuguese silent paragraph reading: 37 readers, 50 paragraphs
  and 2494 interest areas. The paper reports 120 sentences; both released
  tables label 122 sentence groups. Paragraphs come from news, literature
  and popular science. The published cloze sample comprises 393 participants;
  the norms retain exact response counts per target. Four word-level duration
  measures are available, with no fixation-event sequence in this release.
processing: >-
  Reconstruct complete paragraphs from displayed interest-area words and join
  norms by Word_Unique_ID, avoiding 49 shifted Text_ID values in the norms.
  Preserve punctuation and the two multiword regions containing nonbreaking
  spaces. Expose unsmoothed human cloze probabilities, hit counts and response
  totals as aligned stimulus layers. For 122 targets the listed response
  frequencies sum to less than Total_Response_Count; retain that published
  denominator without renormalizing. Unprompted regions have missing cloze
  values; zero-hit prompted regions retain probability zero. Durations of
  unfixated regions are stored as 0 ms, and the default view masks them as
  skips. Study-specific exclusions, smoothing, predictors and model controls
  belong to the analysis recipe.
measures: [first_fixation, first_run, first_pass, go_past, total_time]
