name: ZuCo 1.0
language: en
citation: hollenstein2018zuco
bibtex: |
  @article{hollenstein2018zuco,
    title = {ZuCo, a simultaneous EEG and eye-tracking resource for natural sentence reading},
    author = {Hollenstein, Nora and Rotsztejn, Jonathan and Troendle, Marius and Pedroni, Andreas and Zhang, Ce and Langer, Nicolas},
    journal = {Scientific Data},
    volume = {5},
    pages = {180291},
    year = {2018},
    doi = {10.1038/sdata.2018.291}
  }
url: https://doi.org/10.1038/sdata.2018.291
download_url: https://osf.io/q3zws/
availability: free
paradigm: eye-tracking
stimulus_type: sentence
distribution: authors
description: >-
  ZuCo 1.0: simultaneous EEG and eye-tracking from 12 participants reading
  English sentences in three tasks (Normal Reading, Sentiment Reading,
  Task-Specific Reading). The default is Normal Reading; SR and TSR are selected by task.
  The eye-tracking view exposes per-word FFD, GD, GPT, TRT. Stored as MATLAB v5 (.mat), one file per
  subject per task. The N400/P600 ERP view is registered as zuco_n400.
