paradigm: eye-tracking
stimulus_type: sentence
distribution: authors
description: "ZuCo 2.0: simultaneous EEG and eye-tracking data from 18 participants\
  \ reading 739 English sentences in two tasks: Normal Reading (NR, 349 sentences)\
  \ and Task-Specific Reading (TSR, 390 sentences). Per-word eye-tracking measures\
  \ (FFD, GD, GPT, TRT) and EEG frequency-band power (theta, alpha, beta, gamma) across\
  \ 105 electrodes. Data stored as MATLAB v7.3 (.mat) files, one per subject per task."
