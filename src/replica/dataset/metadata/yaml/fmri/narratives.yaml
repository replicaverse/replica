description: >
  The "Narratives" collection aggregates fMRI datasets collected while
  human participants listened to spoken stories. The collection includes
  345 participants, 891 functional scans, and 27 stories of
  varying duration totaling ~4.6 hours of unique stimuli. The data are
  organized in BIDS format with surface-projected derivatives.
