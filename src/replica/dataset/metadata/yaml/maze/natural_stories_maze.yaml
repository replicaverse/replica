description: >
  The Natural Stories passages read in the A-maze task of Boyce et al. (2020),
  where the distractors are generated automatically as high-surprisal words
  rather than written by hand. At each position the reader chooses between the true next word and its
  distractor, and the latency of that choice is the measure, which attaches to
  the current word with little of the spillover self-paced reading shows.
  Passages are presented in error-correction Maze, so a reader who picks the
  distractor is corrected and continues instead of losing the rest of the item.
  100 participants were recruited, one story each; 95 reported English as a
  native language and 63 of those exceeded the study's 80% accuracy criterion.
  The loader reproduces those exclusions by default and exposes all 100 readers
  via analysed_sample=False. A wrong choice is always dropped, along with the
  next two words by default, which is what the study's own analysis does;
  post_error selects its pre-mistake subset or every correct response instead.
  The first word of a sentence, paired with a nonce distractor because there is
  no context to choose on, is excluded by the analysis mask.
