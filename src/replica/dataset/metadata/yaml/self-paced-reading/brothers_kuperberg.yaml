description: >-
  Critical-region self-paced reading: 648 sentences, three frames (LC / MC /
  HC) for each of 216 critical words, where the frame sets the critical word's
  cloze probability. Each of 216 participants read every critical word once, in
  one of the three conditions. Released DV is ``SUM_3RT``, the summed
  self-paced reading times of the critical word and the two words after it.
  One observation per (participant, item) cell. Each sentence is one stimulus
  with a ``words`` layer, and the value sits at the critical word's position;
  cloze and trigram predictors are stimulus-level metadata.
